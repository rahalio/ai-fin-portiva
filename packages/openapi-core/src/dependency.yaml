openapi: 3.1.0
info:
  title: Portiva Dependencies API
  version: 0.1.0
  description: |
    Vendor dependency inventory and concentration risk rollup across critical systems (BR-4).
  x-domain: dep
  license:
    name: Proprietary
servers:
  - url: https://api.portiva.local
    description: Local Portiva API
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Dependencies
    description: Vendor dependencies and concentration
x-codegen:
  preserveOnClean:
    - extensions
  api-server:
    extensions:
      enabled: true
x-integration-events:
  - type: dependency.recorded
    domain: dependency
    aggregateType: VendorDependency
    description: Vendor dependency recorded against an initiative
    defaultDeliveryMode: sync
paths:
  /v1/dependencies:
    get:
      operationId: listVendorDependencies
      tags: [Dependencies]
      summary: List vendor dependencies
      x-repository: VendorDependency
      x-dynamodb:
        entityType: VENDOR_DEPENDENCY
        pkPatternTemplate: "DEP#${dependencyId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
        filterFields: [initiativeId, vendorName, criticality]
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: initiativeId
          in: query
          schema:
            $ref: ./dependency.schemas.yaml#/components/schemas/InitiativeId
        - name: vendorName
          in: query
          schema:
            type: string
        - name: criticality
          in: query
          schema:
            $ref: ./dependency.schemas.yaml#/components/schemas/DependencyCriticality
      responses:
        '200':
          description: Vendor dependencies
          content:
            application/json:
              schema:
                $ref: ./dependency.schemas.yaml#/components/schemas/VendorDependencyListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createVendorDependency
      tags: [Dependencies]
      summary: Record a vendor dependency
      x-repository: VendorDependency
      x-dynamodb:
        entityType: VENDOR_DEPENDENCY
        pkPatternTemplate: "DEP#${dependencyId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      x-event-types:
        - dependency.recorded
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./dependency.schemas.yaml#/components/schemas/VendorDependencyCreateRequest
      responses:
        '201':
          description: Dependency recorded
          content:
            application/json:
              schema:
                $ref: ./dependency.schemas.yaml#/components/schemas/VendorDependencyResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/dependencies/concentration:
    get:
      operationId: getDependencyConcentration
      tags: [Dependencies]
      summary: Portfolio vendor concentration rollup
      description: Computed view of concentration risk across critical systems (BR-4).
      x-repository: none
      x-codegen:
        api-server:
          handler: extension
      responses:
        '200':
          description: Concentration rollup
          content:
            application/json:
              schema:
                $ref: ./dependency.schemas.yaml#/components/schemas/DependencyConcentrationResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/dependencies/{dependencyId}:
    get:
      operationId: getVendorDependency
      tags: [Dependencies]
      summary: Get vendor dependency
      x-repository: VendorDependency
      x-dynamodb:
        entityType: VENDOR_DEPENDENCY
        pkPatternTemplate: "DEP#${dependencyId}"
        skPatternTemplate: METADATA
        pkPattern: entity
        createdAtField: createdAt
        updatedAtField: updatedAt
        softDeleteEnabled: false
      parameters:
        - name: dependencyId
          in: path
          required: true
          schema:
            $ref: ./dependency.schemas.yaml#/components/schemas/DependencyId
      responses:
        '200':
          description: Vendor dependency
          content:
            application/json:
              schema:
                $ref: ./dependency.schemas.yaml#/components/schemas/VendorDependencyResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
