apis:
  identity:
    root: src/identity.yaml
  initiative:
    root: src/initiative.yaml
  scorecard:
    root: src/scorecard.yaml
  gate:
    root: src/gate.yaml
  decision:
    root: src/decision.yaml
  dependency:
    root: src/dependency.yaml
  policy-watch:
    root: src/policy-watch.yaml
  board-pack:
    root: src/board-pack.yaml
  overlap:
    root: src/overlap.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  operation-summary: off
  info-license-strict: off
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
